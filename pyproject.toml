[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtrack"
version = "0.1.0"
description = "Terminal music player with VLC playback, lyrics sync, and metadata editing."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Backtrack" },
]
keywords = ["music", "terminal", "lyrics", "vlc", "metadata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Terminals",
]
dependencies = [
    "opencv-python>=4.13.0",
    "mutagen>=1.47.0",
    "numpy>=2.0.2",
    "pyperclip>=1.8.2",
    "python-vlc>=3.0.21203",
    "colorama>=0.4.6",
]

[project.scripts]
backtrack = "main:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]
include-package-data = true
