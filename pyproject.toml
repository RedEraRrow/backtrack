[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtrack"
version = "0.1.0"
description = "Terminal music player with VLC playback, lyrics sync, and metadata editing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.13.0.92",
    "mutagen>=1.47.0",
    "numpy>=2.2.6",
    "pyperclip>=1.11.0",
    "python-vlc>=3.0.21203",
    "colorama>=0.4.6",
    "backbone @ git+https://github.com/RedEraRrow/backbone.git",
]

[project.scripts]
backtrack = "backtrack.main:main"

[tool.setuptools.packages.find]
include = ["backtrack*"]
