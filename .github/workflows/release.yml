name: release

# Push a tag matching the version in pyproject.toml (v0.2.0) to publish it to
# PyPI. Uses PyPI trusted publishing: no token is stored anywhere; the
# one-time setup is in docs (add this repo, release.yml and the `pypi`
# environment as a trusted publisher of the package on pypi.org).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
