name: tests

on: [push, pull_request]

# Tested against backbone's current main, checked out beside this repo, so a
# change spanning both is tested together before either is released.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: backtrack
      - uses: actions/checkout@v4
        with:
          repository: RedEraRrow/backbone
          path: backbone
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: ffmpeg and libvlc (the trim and equaliser tests; they skip without them)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libvlc5 vlc-plugin-base
      - run: python -m pip install ./backbone ./backtrack
      - name: Tests (settings and caches in a temporary folder)
        working-directory: backtrack
        env:
          BACKTRACK_CONFIG_DIR: ${{ runner.temp }}/config
          BACKTRACK_CACHE_DIR: ${{ runner.temp }}/cache
        run: python -m unittest discover -s tests
